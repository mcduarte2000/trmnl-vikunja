---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.0
serverless_language: node
polling_url: https://vikunja.miguelduarte.net/api/v1/tasks
polling_headers: "CF-Access-Client-Id: {{ cf_access_client_id }}\r\nCF-Access-Client-Secret: {{ cf_access_client_secret }}\r\nAuthorization: Bearer {{ api_token }}"
polling_body: ''
id: 461534
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: api_token
  field_type: password
  name: Vikunja API Token
  description: Paste your Vikunja API token
  required: true
- keyname: base_url
  field_type: text
  name: Vikunja Instance URL
  description: Your Vikunja instance URL (API path is added automatically)
  placeholder: https://app.vikunja.cloud
  default: https://app.vikunja.cloud
  help_text: 'Enter your Vikunja URL without the /api/v1 suffix. Examples: http://https://my-domain.com:3456 or https://app.vikunja.cloud

    '
- keyname: cf_access_client_id
  field_type: password
  name: CF Access Client ID
  description: Cloudflare Access Client ID for Zero Trust tunnels
  placeholder: "(optional — only if behind Cloudflare Access)"
  default: ''
  help_text: 'Only needed if your Vikunja instance is behind a Cloudflare Zero Trust tunnel. Leave empty otherwise.

    '
  optional: true
- keyname: cf_access_client_secret
  field_type: password
  name: CF Access Client Secret
  description: Cloudflare Access Client Secret for Zero Trust tunnels
  placeholder: "(optional — only if behind Cloudflare Access)"
  default: ''
  help_text: 'Only needed if your Vikunja instance is behind a Cloudflare Zero Trust tunnel. Leave empty otherwise.

    '
  optional: true
- keyname: status_filter
  field_type: select
  name: Task Status
  description: Filter tasks by completion status
  options:
  - Active: active
  - Completed: completed
  - All: all
  default: active
- keyname: priority_filter
  field_type: select
  name: Minimum Priority
  description: Show tasks at or above this priority level
  options:
  - Any: 0
  - Low: 1
  - Medium: 2
  - High: 3
  - Highest: 4
  - Urgent: 5
  default: '0'
- keyname: project_ids
  field_type: text
  name: Project IDs
  description: Filter by project. Leave empty for all projects.
  placeholder: '2'
  default: ''
  help_text: 'Enter one or more project IDs separated by commas (e.g. "2,5,7"). Leave empty to show tasks from all projects.

    '
  optional: true
- keyname: assignee_names
  field_type: text
  name: Assignee Names
  description: Filter by assignee. Leave empty for all assignees.
  placeholder: Miguel
  default: ''
  help_text: 'Enter one or more assignee names separated by commas (e.g. "Miguel,Ana"). Matches against task assignees. Leave empty to show all tasks regardless of assignee.

    '
  optional: true
- keyname: search_query
  field_type: text
  name: Search Keywords
  description: Filter by task title or description. Multiple terms = OR logic.
  placeholder: bug,fix,critical
  default: ''
  help_text: 'Enter one or more keywords separated by commas (e.g. "bug,fix,critical"). A task matches if any keyword is found in its title or description. Leave empty for no search filter.

    '
  optional: true
- keyname: show_favorites_only
  field_type: boolean
  name: Favorites Only
  description: Show only starred/favorite tasks
  default: false
- keyname: min_progress
  field_type: number
  name: Min Progress (%)
  description: Only show tasks with at least this much progress
  min: 0
  max: 100
  default: 0
  optional: true
- keyname: due_within_days
  field_type: select
  name: Due Within
  description: Filter by upcoming due dates
  options:
  - Anytime: 0
  - Today: 1
  - This Week: 7
  - Next 2 Weeks: 14
  - This Month: 30
  default: '0'
- keyname: tasks_per_view
  field_type: number
  name: Tasks Per View
  description: Maximum number of tasks to display
  min: 1
  max: 10
  default: 6
name: Vikunja
description: To‑do app to organize you life
refresh_interval: 15
